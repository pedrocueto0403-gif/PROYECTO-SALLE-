<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Architectural Lines and Campus Silhouette -->
  <g opacity="0.15" stroke="#60A5FA" stroke-width="1.5" fill="none">
    <polygon points="100,800 500,400 900,800"/>
    <polygon points="400,800 800,300 1200,800"/>
    <polygon points="1000,800 1400,450 1800,800"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke-width="3"/>
    <line x1="0" y1="850" x2="1920" y2="850" stroke-width="1"/>
  </g>

  <!-- Glowing Abstract Waves -->
  <path d="M 0 600 Q 480 300 960 700 T 1920 400 L 1920 1080 L 0 1080 Z" fill="url(#glowGold)"/>
</svg>
