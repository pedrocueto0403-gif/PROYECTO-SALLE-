<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2E63"/>
      <stop offset="50%" stop-color="#2D4696"/>
      <stop offset="100%" stop-color="#3B59B6"/>
    </linearGradient>
    
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E823B"/>
      <stop offset="100%" stop-color="#0E5824"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A"/>
      <stop offset="100%" stop-color="#E5B942"/>
    </linearGradient>
    
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring (White Background with Black Border) -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#000000" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner Circle Clipping Mask -->
  <g clip-path="url(#innerCircle)">
    <clipPath id="innerCircle">
      <circle cx="250" cy="250" r="200"/>
    </clipPath>

    <!-- Top Sky Area -->
    <path d="M 50 250 A 200 200 0 0 1 450 250 Z" fill="url(#skyGrad)"/>

    <!-- Sun -->
    <circle cx="270" cy="140" r="45" fill="url(#sunGrad)"/>

    <!-- Clouds -->
    <ellipse cx="180" cy="180" rx="30" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="230" cy="165" rx="35" ry="14" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="150" cy="195" rx="25" ry="10" fill="#FFFFFF" opacity="0.8"/>

    <!-- Mountain Contour -->
    <path d="M 50 250 Q 180 230 250 180 T 450 120 L 450 250 L 50 250 Z" fill="url(#mountainGrad)" stroke="#13401B" stroke-width="3"/>

    <!-- Banner "DIOS, CIENCIA Y VIRTUD" -->
    <rect x="80" y="235" width="340" height="30" fill="#FFFFFF" rx="4" stroke="#D4AF37" stroke-width="2"/>
    <text x="250" y="256" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#D35400" text-anchor="middle" letter-spacing="1">DIOS, CIENCIA Y VIRTUD</text>

    <!-- Lower Ground Area (Golden Yellow) -->
    <rect x="50" y="265" width="400" height="180" fill="url(#groundGrad)"/>

    <!-- Left Icon: Inkwell & Feather Quill -->
    <g transform="translate(110, 310)">
      <ellipse cx="20" cy="40" rx="18" ry="8" fill="#7F8C8D"/>
      <rect x="10" y="25" width="20" height="15" fill="#2C3E50" rx="3"/>
      <path d="M 20 25 Q 35 5 50 -20 Q 30 -5 18 20 Z" fill="#EEEEEE" stroke="#7F8C8D" stroke-width="1.5"/>
    </g>

    <!-- Center Icon: Open Book -->
    <g transform="translate(205, 305)">
      <path d="M 0 35 Q 22 25 45 35 Q 68 25 90 35 L 90 10 Q 68 0 45 10 Q 22 0 0 10 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <path d="M 45 10 L 45 35" stroke="#000000" stroke-width="2"/>
      <!-- Ribbon bookmark -->
      <path d="M 45 10 L 45 45 L 38 40 L 31 45 L 31 10" fill="#C0392B"/>
    </g>

    <!-- Right Icon: Desktop PC Computer -->
    <g transform="translate(310, 285)">
      <!-- Monitor Stand -->
      <rect x="25" y="45" width="16" height="12" fill="#7F8C8D"/>
      <ellipse cx="33" cy="58" rx="20" ry="5" fill="#95A5A6"/>
      <!-- Monitor Outer Frame -->
      <rect x="0" y="0" width="66" height="48" fill="#BDC3C7" stroke="#34495E" stroke-width="3" rx="4"/>
      <!-- Screen Display -->
      <rect x="5" y="5" width="56" height="38" fill="#00A8FF"/>
      <!-- Keyboard -->
      <polygon points="-5,68 71,68 66,59 0,59" fill="#7F8C8D" stroke="#34495E"/>
    </g>
  </g>

  <!-- Inner Border Line -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Curved Text Top: INSTITUTO LA SALLE -->
  <path id="textArcTop" d="M 70 250 A 180 180 0 0 1 430 250" fill="none"/>
  <text font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#0A192F" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      INSTITUTO LA SALLE
    </textPath>
  </text>

  <!-- Curved Text Bottom: CIENAGA MAGDALENA -->
  <path id="textArcBottom" d="M 430 250 A 180 180 0 0 1 70 250" fill="none"/>
  <text font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#0A192F" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      CIENAGA MAGDALENA
    </textPath>
  </text>
</svg>
